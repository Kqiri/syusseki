<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出席ショートカット</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--sub:#6b7280;--ac:#2563eb;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eceef2;--sub:#9aa1ad;--ac:#5b8cff;--bd:#2c313a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eceef2;--sub:#9aa1ad;--ac:#5b8cff;--bd:#2c313a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:18px;margin:4px 0 12px}h2{font-size:14px;margin:0 0 10px;color:var(--sub)}
select,input,button{font:inherit;color:var(--tx)}
select,input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer}
button.main{background:var(--ac);color:#fff;border:0;width:100%;padding:16px;font-size:18px;font-weight:700;border-radius:12px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.big{font-size:22px;font-weight:700}.sub{color:var(--sub);font-size:13px}
.tt{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}
td,th{border:1px solid var(--bd);padding:4px;text-align:center;font-size:12px}td select{padding:4px;font-size:13px}
.now{outline:2px solid var(--ac)}
a{color:var(--ac)}
</style></head><body><main>
<h1>📍 出席ショートカット</h1>

<div class="card"><h2>ユーザー</h2>
<select id="user"></select>
<div class="row"><button id="addU">＋追加</button><button id="delU">削除</button></div>
</div>

<div class="card"><div class="row"><button class="main" id="qId" style="font-size:15px">学番をコピー</button><button class="main" id="qPw" style="font-size:15px">パスワードをコピー</button></div></div>
<div class="card" id="now"></div>

<div class="card"><h2>ログイン情報（このユーザー）</h2>
<input id="name" placeholder="表示名"><div class="row"><input id="sid" placeholder="学番" autocomplete="off"><input id="pw" type="password" placeholder="パスワード" autocomplete="off"></div>
<div class="row"><button id="cpId">学番コピー</button><button id="cpPw">パスワードコピー</button></div>
<p class="sub">※ 情報はこの端末のブラウザ内にだけ保存されます（暗号化はされません）。共用PCでは入力しないでください。</p>
</div>

<div class="card"><h2>自動入力ブックマークレット（PC向け）</h2>
<p class="sub">出席ページは別サイトなので、このページから直接入力はできません。下のリンクをブックマークバーにドラッグし、出席ページを開いた後にクリックすると学番・パスワードが入ります。</p>
<a id="bm" href="#">🔑 自動入力</a>
</div>

<div class="card tt"><h2>時間割（このユーザー）</h2><table id="tt"></table>
<p class="sub">時限の時間は編集できます（開始〜終了、10分前から表示）。</p></div>

<div class="card"><h2>全教室リンク</h2><div id="rooms"></div></div>
</main>
<script>
const ROOMS={"614":"https://attendance.is.chibatech.ac.jp/attendance/class_room/614","625":"https://attendance.is.chibatech.ac.jp/attendance/class_room/625","646":"https://attendance.is.chibatech.ac.jp/attendance/class_room/646","732":"https://attendance.is.chibatech.ac.jp/attendance/class_room/7302","733":"https://attendance.is.chibatech.ac.jp/attendance/class_room/7303"};
const DAYS=["月","火","水","木","金"];
let S={cur:0,periods:[["09:00","10:00"],["10:00","11:00"],["11:00","12:00"],["12:00","13:00"],["13:00","14:00"],["14:00","15:00"],["15:00","16:00"],["16:00","17:00"],["17:00","18:00"],["18:00","19:00"]],users:[{name:"海里",sid:"24G3124",pw:"",tt:{"0-0":"646","0-1":"646","0-2":"646","0-3":"646","1-1":"733","1-2":"733","1-4":"733","1-5":"733","1-6":"733","1-7":"733","2-1":"646","2-2":"646","2-4":"625","2-5":"625","2-6":"625","2-7":"625","3-0":"614","3-1":"614","3-2":"732","3-3":"732"}}]};
try{const r=localStorage.getItem("att_v2");if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem("att_v2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),U=()=>S.users[S.cur];
const mins=t=>{const[a,b]=t.split(":");return +a*60+ +b};
function current(){const d=new Date(),day=d.getDay()-1,m=d.getHours()*60+d.getMinutes();if(day<0||day>4)return{};
 let cur=-1,next=-1;S.periods.forEach((p,i)=>{if(!U().tt[day+"-"+i])return;
  if(m>=mins(p[0])-10&&m<mins(p[1])&&cur<0)cur=i;else if(m<mins(p[0])-10&&next<0)next=i});
 return{day,cur,next}}
function renderNow(){const{day,cur,next}=current(),el=$("now");let h="<h2>今の授業</h2>";
 if(cur>=0){const r=U().tt[day+"-"+cur];h+=`<div class="big">${cur+1}限 ／ 教室 ${r}</div><div class="sub">${S.periods[cur][0]}〜${S.periods[cur][1]}</div><div class="row"><button class="main" id="go">出席ページを開く</button></div><div class="row"><button id="cp2">学番コピー</button><button id="cp3">PWコピー</button></div>`}
 else{h+=`<div class="big">出席する授業はありません</div>`;if(next>=0)h+=`<div class="sub">次: ${next+1}限 教室 ${U().tt[day+"-"+next]}（${S.periods[next][0]}〜）</div>`}
 el.innerHTML=h;
 if(cur>=0){const r=U().tt[day+"-"+cur];$("go").onclick=()=>{cp(U().sid);window.open(ROOMS[r],"_blank")};$("cp2").onclick=()=>cp(U().sid);$("cp3").onclick=()=>cp(U().pw)}}
async function cp(t){let ok=!!t;try{await navigator.clipboard.writeText(t||"")}catch(e){ok=false}
 const d=document.createElement("div");d.textContent=ok?"コピーしました ✓":"コピーできません（未入力か権限なし）";d.style.cssText="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9";document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
function renderUsers(){$("user").innerHTML=S.users.map((u,i)=>`<option value="${i}" ${i==S.cur?"selected":""}>${u.name||"名前なし"}</option>`).join("");
 $("name").value=U().name;$("sid").value=U().sid;$("pw").value=U().pw;bm()}
function bm(){const sid=JSON.stringify(U().sid),pw=JSON.stringify(U().pw);
 const js=`(function(){var i=[].slice.call(document.querySelectorAll('input')).filter(function(x){return x.offsetParent&&x.type!='hidden'});var p=i.filter(function(x){return x.type=='password'})[0];var t=i.filter(function(x){return x!==p&&x.type!='submit'&&x.type!='checkbox'&&x.type!='button'})[0];function s(e,v){if(!e)return;var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;d.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}s(t,${sid});s(p,${pw});})();`;
 $("bm").href="javascript:"+encodeURIComponent(js)}
function renderTT(){let h="<tr><th></th>"+DAYS.map(d=>`<th>${d}</th>`).join("")+"</tr>";
 const{day,cur}=current();
 S.periods.forEach((p,i)=>{h+=`<tr><th>${i+1}限<br><input class="ps" data-i="${i}" data-k="0" value="${p[0]}" style="width:62px;padding:2px;font-size:11px"><br><input class="ps" data-i="${i}" data-k="1" value="${p[1]}" style="width:62px;padding:2px;font-size:11px"></th>`;
  DAYS.forEach((_,d)=>{const v=U().tt[d+"-"+i]||"";h+=`<td class="${d===day&&i===cur?"now":""}"><select data-c="${d}-${i}"><option value="">-</option>${Object.keys(ROOMS).map(r=>`<option ${v===r?"selected":""}>${r}</option>`).join("")}</select></td>`});h+="</tr>"});
 $("tt").innerHTML=h;
 document.querySelectorAll("select[data-c]").forEach(s=>s.onchange=()=>{const k=s.dataset.c;if(s.value)U().tt[k]=s.value;else delete U().tt[k];save();renderNow()});
 document.querySelectorAll(".ps").forEach(s=>s.onchange=()=>{S.periods[s.dataset.i][s.dataset.k]=s.value;save();renderNow()})}
$("user").onchange=e=>{S.cur=+e.target.value;save();all()};
$("addU").onclick=()=>{const n=prompt("名前");if(!n)return;S.users.push({name:n,sid:"",pw:"",tt:{}});S.cur=S.users.length-1;save();all()};
$("delU").onclick=()=>{if(S.users.length<2||!confirm(U().name+" を削除しますか？"))return;S.users.splice(S.cur,1);S.cur=0;save();all()};
$("name").oninput=e=>{U().name=e.target.value;save();const o=$("user").options[S.cur];if(o)o.text=U().name||"名前なし"};
$("sid").oninput=e=>{U().sid=e.target.value;save();bm()};
$("pw").oninput=e=>{U().pw=e.target.value;save();bm()};
$("cpId").onclick=()=>cp(U().sid);$("cpPw").onclick=()=>cp(U().pw);$("qId").onclick=()=>cp(U().sid);$("qPw").onclick=()=>cp(U().pw);
$("rooms").innerHTML=Object.keys(ROOMS).map(r=>`<div class="row"><a href="${ROOMS[r]}" target="_blank" rel="noopener">教室 ${r}</a></div>`).join("");
function all(){renderUsers();renderTT();renderNow()}
all();setInterval(()=>{renderNow()},30000);
</script></body></html>
